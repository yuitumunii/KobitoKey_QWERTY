CONFIG_ZMK_KEYBOARD_NAME="KobitoKey"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_USB=y

# === BLE 接続安定化 (Pyuron 同等) — studio over BLE のハンドシェイク固着対策 ===
CONFIG_BT_BAS=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# 接続中にスリープして studio RPC が無応答になるのを防ぐ
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=3600000

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n


CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_INVERT_X=y
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

CONFIG_SENSOR_ROTATION=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=1000

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=7

# === ZMK Forge ライブ調整 RPC (中央=左 側に集約) ===
# RPC レスポンス用バッファ
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=96
# AML(オートマウス層)の滞留/発火ガード/除外キーをライブ調整
CONFIG_ZMK_INPUT_PROCESSOR_TEMP_LAYER_STUDIO_RPC=y
# ジェスチャー(方向→ショートカット)割当/感度をライブ調整
CONFIG_ZMK_INPUT_PROCESSOR_KEYBIND_STUDIO_RPC=y
# CPI(トラボ感度)ライブ調整 + 左右同期
CONFIG_PMW3610_ALT_STUDIO_RPC_CPI=y
CONFIG_PMW3610_ALT_SPLIT_CPI=y
# hold-tap タイミング / スクロール / カーソル速度
CONFIG_PYURON_TIMING_STUDIO_RPC=y
CONFIG_PYURON_SCROLL_STUDIO_RPC=y
CONFIG_PYURON_SPEED_STUDIO_RPC=y
# マクロ / コンボ / タップダンス の実行時編集
CONFIG_PYURON_MACRO_STUDIO_RPC=y
CONFIG_PYURON_COMBO_STUDIO_RPC=y
CONFIG_PYURON_TAPDANCE_STUDIO_RPC=y
